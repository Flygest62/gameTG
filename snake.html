<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Змейка — Рекорды</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0d0f14;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 16px;
      background-image: radial-gradient(circle at 50% 0%, #064e3b 0%, #0d0f14 70%);
    }

    /* Верхний HUD */
    .hud {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 2;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .game-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #22c55e, #a3e635);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .player-badge {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 99px;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      background: rgba(23, 27, 38, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 11px;
      color: #e2e8f0;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .scores-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .score-card {
      background: rgba(23, 27, 38, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .score-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }

    .score-value {
      font-size: 24px;
      font-weight: 800;
      color: #fbbf24;
      line-height: 1.15;
    }

    .best-value {
      color: #f8fafc;
    }

    /* Игровая арена */
    .board-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      margin: 8px 0;
    }

    #gameCanvas {
      background: #12171f;
      border: 2px solid rgba(34, 197, 94, 0.35);
      border-radius: 18px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65), 0 0 28px rgba(34, 197, 94, 0.12);
    }

    .hint-bar {
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    /* Модальное окно конца игры */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 11, 16, 0.86);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .overlay.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 310px;
      background: #171b26;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .stat-box {
      background: #0f121a;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-box-label {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 2px;
    }

    .stat-box-val {
      font-size: 22px;
      font-weight: 800;
      color: #fbbf24;
    }

    .tg-status {
      font-size: 12px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
    }
  </style>
</head>
<body>

  <header class="hud">
    <div class="top-bar">
      <div class="title-group">
        <span class="game-title">ЗМЕЙКА</span>
        <span class="player-badge" id="playerName">Игрок</span>
      </div>
      <button class="icon-btn" id="soundBtn">🔇</button>
    </div>

    <div class="scores-row">
      <div class="score-card">
        <span class="score-label">Очки</span>
        <span class="score-value" id="scoreDisplay">0</span>
      </div>
      <div class="score-card">
        <span class="score-label">Рекорд</span>
        <span class="score-value best-value" id="bestDisplay">0</span>
      </div>
    </div>
  </header>

  <main class="board-wrapper" id="boardWrapper">
    <canvas id="gameCanvas"></canvas>
  </main>

  <footer class="hint-bar">
    Свайпай в любую сторону (или стрелки / WASD) • Золотое яблоко даёт <b>+50 очков</b>!
  </footer>

  <div class="overlay" id="gameOverOverlay">
    <div class="modal">
      <h2>Столкновение!</h2>
      <p id="newRecordBadge" style="color: #22c55e; font-size: 13px; font-weight: 700; display: none; margin-top: 4px;">
        🔥 Новый личный рекорд!
      </p>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-box-label">Счёт</div>
          <div class="stat-box-val" id="finalScore">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-label">Длина</div>
          <div class="stat-box-val" id="finalLength" style="color: #22c55e;">3</div>
        </div>
      </div>
      <div class="tg-status" id="tgStatusText">Рекорд сохранён локально</div>
      <button class="primary-btn" id="restartBtn">Играть снова</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. ПОДКЛЮЧЕНИЕ К TELEGRAM БОТУ
    // =========================================================================
    const SERVER_URL = ""; // Например: "https://твой-бот.ru/api/submit_score"

    let tg = null;
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
          document.getElementById("playerName").textContent = tg.initDataUnsafe.user.first_name;
        }
      }
    } catch (e) {}

    function sendScoreToBot(finalScore) {
      const statusEl = document.getElementById("tgStatusText");
      if (!tg || !tg.initData || !SERVER_URL) {
        statusEl.textContent = "Локальный режим (готово к подключению бота)";
        return;
      }

      statusEl.textContent = "Отправка рекорда в чат...";
      fetch(SERVER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          initData: tg.initData,
          game: "snake",
          score: finalScore
        })
      })
      .then(res => res.json())
      .then(() => { statusEl.textContent = "✅ Рекорд отправлен в группу!"; })
      .catch(() => { statusEl.textContent = "⚠️ Сервер бота недоступен"; });
    }

    // =========================================================================
    // 2. ЗВУКИ (Web Audio API)
    // =========================================================================
    const SoundFX = (() => {
      let ctx = null;
      let enabled = false;

      function init() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === "suspended") ctx.resume();
      }

      function play(freq, type, dur, vol = 0.08, slideTo = null) {
        if (!enabled) return;
        init();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      }

      return {
        toggle() { enabled = !enabled; if (enabled) init(); return enabled; },
        turn: () => play(240, "sine", 0.03, 0.03),
        eat: () => play(460, "sine", 0.1, 0.09, 680),
        gold: () => {
          play(580, "triangle", 0.1, 0.1, 880);
          setTimeout(() => play(880, "sine", 0.15, 0.1, 1150), 80);
        },
        crash: () => play(180, "sawtooth", 0.32, 0.09, 55)
      };
    })();

    // =========================================================================
    // 3. ЛОГИКА ЗМЕЙКИ С ПЛАВНОЙ ИНТЕРПОЛЯЦИЕЙ МЕЖДУ КЛЕТКАМИ
    // =========================================================================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const boardWrapper = document.getElementById("boardWrapper");

    const GRID = 18; // Поле 18x18 клеток
    let cellSize = 18;
    let dpr = window.devicePixelRatio || 1;

    let snake = [];
    let prevSnake = [];
    let dir = { x: 1, y: 0 };
    let inputQueue = [];

    let apple = { x: 12, y: 9 };
    let goldenApple = null; // { x, y, timer, maxTimer }
    let particles = [];

    let score = 0;
    let bestScore = parseInt(localStorage.getItem("snake_best_v1") || "0", 10);
    let isGameOver = false;

    let stepAccumulator = 0;
    let lastTime = 0;

    document.getElementById("bestDisplay").textContent = bestScore;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const side = Math.floor(Math.min(boardWrapper.clientWidth, boardWrapper.clientHeight));
      cellSize = Math.max(12, Math.floor(side / GRID));
      const boardPx = cellSize * GRID;

      canvas.style.width = boardPx + "px";
      canvas.style.height = boardPx + "px";
      canvas.width = boardPx * dpr;
      canvas.height = boardPx * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function randomFreeCell() {
      while (true) {
        const x = Math.floor(Math.random() * GRID);
        const y = Math.floor(Math.random() * GRID);
        const onSnake = snake.some(s => s.x === x && s.y === y);
        const onApple = apple && apple.x === x && apple.y === y;
        const onGold = goldenApple && goldenApple.x === x && goldenApple.y === y;
        if (!onSnake && !onApple && !onGold) return { x, y };
      }
    }

    function startNewGame() {
      snake = [
        { x: 6, y: 9 },
        { x: 5, y: 9 },
        { x: 4, y: 9 }
      ];
      prevSnake = snake.map(s => ({ ...s }));
      dir = { x: 1, y: 0 };
      inputQueue = [];
      score = 0;
      isGameOver = false;
      goldenApple = null;
      particles = [];
      stepAccumulator = 0;

      apple = randomFreeCell();

      document.getElementById("scoreDisplay").textContent = "0";
      document.getElementById("gameOverOverlay").classList.remove("active");
      lastTime = performance.now();
    }

    function queueDirection(nx, ny) {
      if (isGameOver) return;
      const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : dir;
      // Запрещаем разворот на 180 градусов и дублирование направления
      if ((nx === -lastDir.x && ny === -lastDir.y) || (nx === lastDir.x && ny === lastDir.y)) {
        return;
      }
      if (inputQueue.length < 2) {
        inputQueue.push({ x: nx, y: ny });
        SoundFX.turn();
      }
    }

    function spawnEatParticles(gx, gy, color) {
      const cx = (gx + 0.5) * cellSize;
      const cy = (gy + 0.5) * cellSize;
      for (let i = 0; i < 10; i++) {
        const ang = (Math.PI * 2 * i) / 10 + Math.random() * 0.4;
        const spd = 45 + Math.random() * 85;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          r: 3 + Math.random() * 2.5,
          color,
          life: 1
        });
      }
    }

    function stepSimulation() {
      if (inputQueue.length > 0) {
        dir = inputQueue.shift();
      }

      prevSnake = snake.map(s => ({ ...s }));
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Проверка столкновения со стенами
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        triggerGameOver();
        return;
      }

      // Проверка столкновения с собственным хвостом (кроме самого кончика, который сейчас уйдёт)
      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          triggerGameOver();
          return;
        }
      }

      snake.unshift(head);

      // Проверка сбора обычного яблока
      if (head.x === apple.x && head.y === apple.y) {
        score += 10;
        updateScore();
        SoundFX.eat();
        spawnEatParticles(apple.x, apple.y, "#ef4444");
        apple = randomFreeCell();

        // Добавляем дубликат хвоста в prevSnake для плавного роста
        prevSnake.push({ ...prevSnake[prevSnake.length - 1] });

        // С вероятностью 30% спавним бонусное золотое яблоко на 6 секунд
        if (!goldenApple && Math.random() < 0.32) {
          const pos = randomFreeCell();
          goldenApple = { x: pos.x, y: pos.y, timer: 6000, maxTimer: 6000 };
        }
      } else if (goldenApple && head.x === goldenApple.x && head.y === goldenApple.y) {
        score += 50;
        updateScore();
        SoundFX.gold();
        spawnEatParticles(goldenApple.x, goldenApple.y, "#fbbf24");
        goldenApple = null;
        prevSnake.push({ ...prevSnake[prevSnake.length - 1] });
      } else {
        snake.pop();
      }
    }

    function updateScore() {
      document.getElementById("scoreDisplay").textContent = score;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("snake_best_v1", bestScore);
        document.getElementById("bestDisplay").textContent = bestScore;
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      SoundFX.crash();

      const isNewBest = score > 0 && score >= bestScore;
      document.getElementById("newRecordBadge").style.display = isNewBest ? "block" : "none";
      document.getElementById("finalScore").textContent = score;
      document.getElementById("finalLength").textContent = snake.length;
      document.getElementById("gameOverOverlay").classList.add("active");

      sendScoreToBot(score);
    }

    // =========================================================================
    // 4. ОТРИСОВКА ПОЛЯ, ПЛАВНОЙ ЗМЕЙКИ И ЯБЛОК
    // =========================================================================
    function render(dt, stepAlpha) {
      const boardPx = GRID * cellSize;
      ctx.clearRect(0, 0, boardPx, boardPx);

      // Шахматная мягкая подсветка поля
      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? "rgba(255,255,255,0.02)" : "rgba(0,0,0,0.08)";
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
        }
      }

      const pulse = 1 + Math.sin(performance.now() * 0.007) * 0.08;

      // Обычное яблоко
      if (apple) {
        const ax = (apple.x + 0.5) * cellSize;
        const ay = (apple.y + 0.5) * cellSize;
        ctx.save();
        ctx.shadowColor = "rgba(239, 68, 68, 0.65)";
        ctx.shadowBlur = 12;
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(ax, ay, cellSize * 0.36 * pulse, 0, Math.PI * 2);
        ctx.fill();

        // Листик яблока
        ctx.fillStyle = "#4ade80";
        ctx.beginPath();
        ctx.ellipse(ax + 3, ay - cellSize * 0.34, 4, 2.2, -0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Бонусное золотое яблоко с индикатором времени
      if (goldenApple) {
        const gx = (goldenApple.x + 0.5) * cellSize;
        const gy = (goldenApple.y + 0.5) * cellSize;
        const ratio = Math.max(0, goldenApple.timer / goldenApple.maxTimer);

        ctx.save();
        ctx.shadowColor = "rgba(251, 191, 36, 0.85)";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.arc(gx, gy, cellSize * 0.4 * pulse, 0, Math.PI * 2);
        ctx.fill();

        // Дуга оставшегося времени вокруг золотого яблока
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(gx, gy, cellSize * 0.47, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio);
        ctx.stroke();
        ctx.restore();
      }

      // Плавная отрисовка тела змейки с интерполяцией между шагами
      const t = isGameOver ? 1 : stepAlpha;
      for (let i = snake.length - 1; i >= 0; i--) {
        const cur = snake[i];
        const prev = prevSnake[i] || cur;
        const ix = prev.x + (cur.x - prev.x) * t;
        const iy = prev.y + (cur.y - prev.y) * t;

        const cx = (ix + 0.5) * cellSize;
        const cy = (iy + 0.5) * cellSize;
        const taper = 1 - (i / (snake.length + 4)) * 0.32;
        const radius = (cellSize * 0.43) * taper;

        ctx.fillStyle = i === 0 ? "#4ade80" : (i % 2 === 0 ? "#22c55e" : "#16a34a");
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();

        // Глаза на голове змейки
        if (i === 0) {
          const eyeOffset = cellSize * 0.16;
          const forward = cellSize * 0.14;
          const ex1 = cx + dir.x * forward - dir.y * eyeOffset;
          const ey1 = cy + dir.y * forward + dir.x * eyeOffset;
          const ex2 = cx + dir.x * forward + dir.y * eyeOffset;
          const ey2 = cy + dir.y * forward - dir.x * eyeOffset;

          ctx.fillStyle = "#0f172a";
          ctx.beginPath();
          ctx.arc(ex1, ey1, 2.3, 0, Math.PI * 2);
          ctx.arc(ex2, ey2, 2.3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Частицы при поедании
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const sec = dt / 1000;
        p.x += p.vx * sec;
        p.y += p.vy * sec;
        p.life -= sec * 2.5;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // =========================================================================
    // 5. УПРАВЛЕНИЕ СВАЙПАМИ И КЛАВИШАМИ
    // =========================================================================
    document.addEventListener("keydown", (e) => {
      if (e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); queueDirection(0, -1); }
      else if (e.code === "ArrowDown" || e.code === "KeyS") { e.preventDefault(); queueDirection(0, 1); }
      else if (e.code === "ArrowLeft" || e.code === "KeyA") { e.preventDefault(); queueDirection(-1, 0); }
      else if (e.code === "ArrowRight" || e.code === "KeyD") { e.preventDefault(); queueDirection(1, 0); }
    });

    // Свайпы с мгновенным откликом (без ожидания отрыва пальца от экрана!)
    let touchStartX = 0;
    let touchStartY = 0;
    let swipeHandled = false;

    document.addEventListener("touchstart", (e) => {
      if (e.touches.length > 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      swipeHandled = false;
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (swipeHandled || isGameOver) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;

      if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) {
        swipeHandled = true;
        if (Math.abs(dx) > Math.abs(dy)) {
          queueDirection(dx > 0 ? 1 : -1, 0);
        } else {
          queueDirection(0, dy > 0 ? 1 : -1);
        }
        // Позволяем делать непрерывные повороты, не отрывая палец
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        swipeHandled = false;
      }
    }, { passive: true });

    document.getElementById("restartBtn").addEventListener("click", startNewGame);
    document.getElementById("soundBtn").addEventListener("click", (e) => {
      const on = SoundFX.toggle();
      e.currentTarget.textContent = on ? "🔊" : "🔇";
    });

    function gameLoop(now) {
      const dt = Math.min(now - lastTime, 100);
      lastTime = now;

      // Скорость плавно растёт по мере увеличения длины змейки
      const stepInterval = Math.max(75, 145 - (snake.length - 3) * 2.2);

      if (!isGameOver) {
        if (goldenApple) {
          goldenApple.timer -= dt;
          if (goldenApple.timer <= 0) goldenApple = null;
        }

        stepAccumulator += dt;
        while (stepAccumulator >= stepInterval && !isGameOver) {
          stepAccumulator -= stepInterval;
          stepSimulation();
        }
      }

      const stepAlpha = Math.min(1, stepAccumulator / stepInterval);
      render(dt, stepAlpha);
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("load", () => {
      resizeCanvas();
      startNewGame();
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
